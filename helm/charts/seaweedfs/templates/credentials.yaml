{{/*
The S3 credentials for the whole platform.

common.gotmpl regenerates objectStoreSecretKey with randAlphaNum on EVERY
helmfile run, so the value coming in through .Values is only ever the seed for
a first install. On every later run we read the already-deployed secret back
and keep it, otherwise the password would rotate underneath Flink, wal-g and
Velero on each apply and they would lose access to their buckets.

s3.json is rendered from the very same pair, so the identity SeaweedFS
authenticates against can never drift from the credentials the clients use.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "objectstore-credentials") -}}
{{- $access := .Values.s3.userAccessKey | toString -}}
{{- $secretKey := .Values.s3.userSecretKey | toString -}}
{{- if and $existing $existing.data -}}
  {{- if (index $existing.data "ACCESS_KEY") -}}
    {{- $access = (index $existing.data "ACCESS_KEY" | b64dec) -}}
  {{- end -}}
  {{- if (index $existing.data "SECRET_KEY") -}}
    {{- $secretKey = (index $existing.data "SECRET_KEY" | b64dec) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: objectstore-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ACCESS_KEY: {{ $access | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  s3.json: |
    {
      "identities": [
        {
          "name": "iff",
          "credentials": [
            {
              "accessKey": {{ $access | quote }},
              "secretKey": {{ $secretKey | quote }}
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
