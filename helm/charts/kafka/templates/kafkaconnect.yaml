apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: kafka-connect
  annotations:
    strimzi.io/use-connector-resources: "true"
  labels:
    app: {{ template "strimzi.name" . }}
    chart: {{ template "strimzi.chart" . }}
    component: deployment
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: 1
  image: {{ .Values.mainRegistry }}/{{ .Values.mainRepo }}/{{ .Values.kafka.connect.image }}:{{ .Values.mainVersion }}
  jvmOptions:
    "-Xms": {{ .Values.kafka.connect.heap | default "128M" | quote }}
    "-Xmx": {{ .Values.kafka.connect.heap | default "128M" | quote }}
  bootstrapServers: {{ .Values.kafka.bootstrapServer }}
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    config.providers: file
    config.providers.file.class: org.apache.kafka.common.config.provider.FileConfigProvider
    # The connectors bound their producer's buffer.memory (see
    # kafka.connect.producerBufferMemory); that needs client overrides.
    # "All" is also the Kafka 3.x default -- stated here so the bound does
    # not silently depend on it.
    connector.client.config.override.policy: All
  template:
    pod:
      imagePullSecrets:
        - name: {{ .Values.pullSecretCredentials }}