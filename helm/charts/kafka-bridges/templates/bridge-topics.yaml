{{- /*
segment.ms is max(retention.ms, 1 h) on every topic. Kafka deletes only whole
segments, and only once the newest record in a segment is older than
retention.ms. While a topic is written to, its open segment rolls only after
segment.ms (broker default 7 days), so with the default a 1 h topic kept up to
7 days of records. A record now goes after at most retention.ms + segment.ms +
log.retention.check.interval.ms. Topics with a shorter retention (10 s) roll
hourly, so they keep up to about an hour instead of 7 days: rolling them at
10 s would delete records that a restarted consumer or a test still reads back.
test/bats-unit/kafka-topic-segments.bats checks this.
*/}}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{.Values.kafkaBridge.debezium.listenTopic}}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: {{.Values.kafkaBridge.debezium.listenTopicRetention}}
    segment.ms: {{ max 3600000 (int64 .Values.kafkaBridge.debezium.listenTopicRetention) }}
    compression.type: {{.Values.kafkaBridge.debezium.listenTopicCompression}}
---
{{- $topicExists := (lookup "kafka.strimzi.io/v1beta2" "KafkaTopic" .Release.Namespace .Values.kafkaBridge.debezium.attributesTopic) }}
{{- if not $topicExists }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .Values.kafkaBridge.debezium.attributesTopic }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: {{ .Values.kafkaBridge.debezium.attributesTopicRetention }}
    segment.ms: {{ max 3600000 (int64 .Values.kafkaBridge.debezium.attributesTopicRetention) }}
    compression.type: {{ .Values.kafkaBridge.debezium.attributesTopicCompression }}
{{- end }}
---
{{- $topicExists := (lookup "kafka.strimzi.io/v1beta2" "KafkaTopic" .Release.Namespace .Values.kafkaBridge.debezium.entitiesTopic) }}
{{- if not $topicExists }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .Values.kafkaBridge.debezium.entitiesTopic }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: {{ .Values.kafkaBridge.debezium.attributesTopicRetention }}
    segment.ms: {{ max 3600000 (int64 .Values.kafkaBridge.debezium.attributesTopicRetention) }}
    compression.type: {{ .Values.kafkaBridge.debezium.attributesTopicCompression }}
{{- end }}