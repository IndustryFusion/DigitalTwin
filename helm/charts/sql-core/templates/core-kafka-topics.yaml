{{- /*
segment.ms is max(retention.ms, 1 h) on every topic. Kafka deletes only whole
segments, and only once the newest record in a segment is older than
retention.ms. While a topic is written to, its open segment rolls only after
segment.ms (broker default 7 days), so with the default a 1 h topic kept up to
7 days of records. A record now goes after at most retention.ms + segment.ms +
log.retention.check.interval.ms. Topics with a shorter retention (10 s) roll
hourly, so they keep up to about an hour instead of 7 days: rolling them at
10 s would delete records that a restarted consumer or a test still reads back.
test/bats-unit/kafka-topic-segments.bats checks this.

Every topic is rendered on every install and upgrade, and each topic has one
owning release: sql-core owns the alert topics, iff.ngsild-updates and the
attributes insert topic; kafka-bridges owns iff.ngsild.attributes and
iff.ngsild.entities. A topic rendered only while missing (a `lookup` guard)
is in the manifest of the install but not of the next upgrade, and helm deletes
what drops out of a release's manifest; Strimzi then deletes the topic in
Kafka. Rendering it always keeps it in the manifest and lets a changed config
reach the existing topic. helm.sh/resource-policy: keep stops helm from
deleting a topic another component reads when this release is uninstalled or
the topic leaves the chart. test/bats-unit/kafka-topic-ownership.bats checks
this.
*/}}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{.Values.kafkaBridge.alerta.bulkTopic}}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: {{.Values.kafkaBridge.alerta.bulkTopicRetention}}
    segment.ms: {{ max 3600000 (int64 .Values.kafkaBridge.alerta.bulkTopicRetention) }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{.Values.kafkaBridge.alerta.listenTopic}}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: {{.Values.kafkaBridge.alerta.listenTopicRetention}}
    segment.ms: {{ max 3600000 (int64 .Values.kafkaBridge.alerta.listenTopicRetention) }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{.Values.kafkaBridge.ngsildUpdates.listenTopic}}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: {{.Values.kafkaBridge.ngsildUpdates.listenTopicRetention}}
    segment.ms: {{ max 3600000 (int64 .Values.kafkaBridge.ngsildUpdates.listenTopicRetention) }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{.Values.kafkaBridge.debezium.attributesTopic}}-insert
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: '{{.Values.kafkaBridge.alerta.bulkTopicRetention}}'
    segment.ms: {{ max 3600000 (int64 .Values.kafkaBridge.alerta.bulkTopicRetention) }}
  topicName: {{.Values.kafkaBridge.debezium.attributesTopic}}_insert
