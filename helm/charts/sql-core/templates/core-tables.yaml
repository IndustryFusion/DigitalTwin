  kafka:
    topic: {{.Values.kafkaBridge.ngsildUpdates.listenTopic}}
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    scan.startup.mode: latest-offset
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes
spec:
  name: attributes
  connector: kafka
  fields:
    - id: STRING
    - parentId: STRING
    - entityId: STRING
    - name: STRING
    - nodeType: STRING
    - valueType: STRING
    - type: STRING
    - attributeValue: STRING
    - datasetId: STRING
    - unitCode: STRING
    - lang: STRING
    - deleted: BOOLEAN
    - synced: BOOLEAN
    # The EVENT time, carried in the payload by debeziumBridge. `ts` is the
    # WRITE time: putting observedAt in the record stamp meant retention.ms, a
    # wall-clock storage policy, was applied to an event time, and every record
    # for a historical observation was deleted on contact.
    - 'observedAt': TIMESTAMP(3)
    - 'ts': TIMESTAMP(3) METADATA FROM 'timestamp'
    # Declaring the watermark promotes eventTime to a ROWTIME, which is what
    # makes attributes_view compile into Deduplicate (keep-last-row) rather
    # than a general Rank: ties go to arrival, and the changelog is declared
    # correctly on Flink 2.1+. Nothing windows over this table, so no operator
    # here consumes the watermark; Deduplicate compares rowtimes and does not
    # drop late rows, so an out-of-order event time is ordered, not discarded.
    # COALESCE so a writer setting no observedAt (the `synced` writeback) falls
    # back to write time instead of NULL. Mirrors create_core_tables.py.
    - 'eventTime': AS COALESCE(`observedAt`, `ts`)
    - 'watermark': FOR `eventTime` AS `eventTime`
  kafka:
    topic: {{.Values.kafkaBridge.debezium.attributesTopic}}
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    scan.startup.mode: latest-offset
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes-writeback
spec:
  name: attributes_writeback
  connector: upsert-kafka
  fields:
  - id: STRING
  - parentId: STRING
  - entityId: STRING
  - name: STRING
  - nodeType: STRING
  - valueType: STRING
  - type: STRING
  - attributeValue: STRING
  - datasetId: STRING
  - unitCode: STRING
  - lang: STRING
  - deleted: BOOLEAN
  - synced: BOOLEAN
  kafka:
    topic: iff.ngsild.attributes
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    key.format: json
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
  primaryKey:
  - id
  - datasetId
---
apiVersion: industry-fusion.com/v1alpha1
kind: BeamSqlView
metadata:
  name: attributes-view
spec:
  name: attributes_view
  sqlstatement: |
    SELECT id, parentId, entityId, name, nodeType, valueType, `type`,
            `attributeValue`,
            `datasetId`,
            `unitCode`,
            `lang`,
            `deleted`,
            `synced`,
           `observedAt`,
           `ts`
    FROM (
      -- viewTtl, not ttl. This dedup holds one row per live attribute and is
      -- what turns a stream of attribute rows into a changelog. Expiring a
      -- key makes the next row for it an INSERT rather than an update, so the
      -- -U that would have withdrawn the previous value is never emitted and
      -- every consumer keeps counting an attribute that is gone. A delete
      -- arrives as an ordinary row carrying deleted=true, so it is exactly
      -- the case this breaks.
      -- ONE sort column, and it is the ROWTIME `eventTime`. That compiles
      -- into Flink's Deduplicate (keep-last-row) instead of a general Rank,
      -- which matters twice.
      --
      -- Ties: same-instant records are real -- the bridge stamps records
      -- lacking an observedAt with its receive time, and snapshot
      -- re-emissions repeat their record's timestamp exactly. A Rank keeps
      -- the INCUMBENT on a tie; Deduplicate takes the later arrival.
      -- Measured on urn:filter:1 hasStrength (observedAt 2024-02-28T13:52:35):
      -- the view latched a deleted=true row, four later re-emissions of the
      -- live value all tied and lost, and the count constraint reported
      -- "Found 0 properties instead of [1, 1]" against an attribute that
      -- plainly existed. A Kafka-offset tie-break column used to restore this
      -- explicitly; the rowtime gives it for free, so that column is gone.
      --
      -- Soundness: from Flink 2.1 a top-1 ROW_NUMBER whose ORDER BY is not a
      -- single time attribute is wrongly declared INSERT_ONLY and its
      -- retractions are silently dropped -- alerts raise and never clear. The
      -- two-column key hit exactly that. Do NOT add a second sort column.
      -- See semantic-model/shacl2flink/docs/flink-2.3-retraction-bug.md.
      --
      -- Must mirror lib/utils.py create_yaml_view.
      SELECT /*+ STATE_TTL('attributes' = '{{.Values.flink.viewTtl}}') */ *,
      ROW_NUMBER() OVER (PARTITION BY `id`, `datasetId`
         ORDER BY `eventTime` DESC) AS rownum
      FROM `attributes`)
      WHERE rownum = 1;
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes-insert
spec:
  name: attributes_insert
  connector: upsert-kafka
  fields:
  - id: STRING
  - parentId: STRING
  - entityId: STRING
  - name: STRING
  - nodeType: STRING
  - valueType: STRING
  - type: STRING
  - attributeValue: STRING
  - datasetId: STRING
  - unitCode: STRING
  - lang: STRING
  - deleted: BOOLEAN
  - synced: BOOLEAN
  - ts: TIMESTAMP(3) METADATA FROM 'timestamp' VIRTUAL
  - watermark: FOR `ts` AS `ts`
  kafka:
    topic: iff.ngsild.attributes_insert
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    key.format: json
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
  primaryKey:
  - id
  - datasetId
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes-insert-filter
spec:
  name: attributes_insert_filter
  connector: kafka
  fields:
  - id: STRING
  - parentId: STRING
  - entityId: STRING
  - name: STRING
  - nodeType: STRING
  - valueType: STRING
  - type: STRING
  - attributeValue: STRING
  - datasetId: STRING
  - unitCode: STRING
  - lang: STRING
  - deleted: BOOLEAN
  - synced: BOOLEAN
  - ts: TIMESTAMP(3) METADATA FROM 'timestamp'
  - watermark: FOR `ts` AS `ts`
  kafka:
    topic: iff.ngsild.attributes_insert
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    scan.startup.mode: latest-offset
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
---
apiVersion: industry-fusion.com/v1alpha1
kind: BeamSqlView
metadata:
  name: attributes-insert-view
spec:
  name: attributes_insert_view
  sqlstatement: |
    SELECT entityId, name, nodeType, valueType, `type`,
          `attributeValue`,
          `datasetId`,
          `unitCode`,
          `lang`,
          `deleted`,
          `synced`,
          `ts`
    FROM (
      SELECT /*+ STATE_TTL('attributes_insert_filter' = '{{.Values.flink.ttl}}') */ *,
      ROW_NUMBER() OVER (PARTITION BY `id`, `datasetId`
         ORDER BY ts DESC) AS rownum
      FROM `attributes_insert_filter`)
      WHERE rownum = 1;