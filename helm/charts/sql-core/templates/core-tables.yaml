---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: alerts
spec:
  name: alerts
  connector: kafka
  fields:
    - 'resource': STRING
    - 'event': STRING
    - 'environment': STRING
    - 'service': ARRAY<STRING>
    - 'severity': STRING
    - 'customer': STRING
    - 'text': STRING
  kafka:
    topic: {{.Values.kafkaBridge.alerta.listenTopic}}
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    scan.startup.mode: latest-offset
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: alerts-bulk
spec:
  name: alerts_bulk
  connector: upsert-kafka
  fields:
    - 'resource': STRING
    - 'event': STRING
    - 'environment': STRING
    - 'service': ARRAY<STRING>
    - 'severity': STRING
    - 'customer': STRING
    - 'text': STRING
    - 'watermark': FOR ts AS ts - INTERVAL {{.Values.flink.alertDelay | squote}} SECONDS
    - 'ts': TIMESTAMP(3) METADATA FROM 'timestamp' VIRTUAL
  kafka:
    topic: {{.Values.kafkaBridge.alerta.bulkTopic}}
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    key.format: json
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
  primaryKey: [resource, event, environment]
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: ngsild-updates
spec:
  name: ngsild_updates
  connector: kafka
  fields:
    - 'op': STRING
    - 'overwriteOrReplace': Boolean
    - 'noForward': Boolean
    - 'entities': STRING
  kafka:
    topic: {{.Values.kafkaBridge.ngsildUpdates.listenTopic}}
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    scan.startup.mode: latest-offset
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes
spec:
  name: attributes
  connector: kafka
  fields:
    - id: STRING
    - parentId: STRING
    - entityId: STRING
    - name: STRING
    - nodeType: STRING
    - valueType: STRING
    - type: STRING
    - attributeValue: STRING
    - datasetId: STRING
    - unitCode: STRING
    - lang: STRING
    - deleted: BOOLEAN
    - synced: BOOLEAN
    # No WATERMARK. Nothing windows over this table, and only time-based
    # operators consume a watermark. What the declaration would change is which
    # operator backs the attributes_view dedup -- a rowtime Deduplicate accepts
    # a later row of EQUAL ts, a general Rank keeps the incumbent -- and a
    # delete is stamped with the observedAt of the value it deletes, so those two
    # tie exactly. The `offset` column below settles that explicitly rather than
    # leaving it to operator choice. Mirrors create_core_tables.py.
    #
    # The EVENT time, carried in the payload by debeziumBridge. `ts` is now the
    # WRITE time and nothing orders by it: putting observedAt in the record
    # stamp meant retention.ms, a wall-clock storage policy, was applied to an
    # event time, and every record for a historical observation was deleted on
    # contact. Mirrors create_core_tables.py.
    - 'observedAt': TIMESTAMP(3)
    - 'ts': TIMESTAMP(3) METADATA FROM 'timestamp'
    - 'offset': BIGINT METADATA VIRTUAL
  kafka:
    topic: {{.Values.kafkaBridge.debezium.attributesTopic}}
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    scan.startup.mode: latest-offset
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes-writeback
spec:
  name: attributes_writeback
  connector: upsert-kafka
  fields:
  - id: STRING
  - parentId: STRING
  - entityId: STRING
  - name: STRING
  - nodeType: STRING
  - valueType: STRING
  - type: STRING
  - attributeValue: STRING
  - datasetId: STRING
  - unitCode: STRING
  - lang: STRING
  - deleted: BOOLEAN
  - synced: BOOLEAN
  kafka:
    topic: iff.ngsild.attributes
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    key.format: json
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
  primaryKey:
  - id
  - datasetId
---
apiVersion: industry-fusion.com/v1alpha1
kind: BeamSqlView
metadata:
  name: attributes-view
spec:
  name: attributes_view
  sqlstatement: |
    SELECT id, parentId, entityId, name, nodeType, valueType, `type`,
            `attributeValue`,
            `datasetId`,
            `unitCode`,
            `lang`,
            `deleted`,
            `synced`,
           `observedAt`,
           `ts`
    FROM (
      -- viewTtl, not ttl. This dedup holds one row per live attribute and is
      -- what turns a stream of attribute rows into a changelog. Expiring a
      -- key makes the next row for it an INSERT rather than an update, so the
      -- -U that would have withdrawn the previous value is never emitted and
      -- every consumer keeps counting an attribute that is gone. A delete
      -- arrives as an ordinary row carrying deleted=true, so it is exactly
      -- the case this breaks.
      -- The Kafka offset breaks the tie. debeziumBridge stamps a DELETE with
      -- the timestamp of the value it deletes -- deliberately the SAME
      -- timestamp -- so a value and its delete tie on `observedAt`. Without a rowtime
      -- this compiles into a general Rank, and Rank keeps the INCUMBENT on a
      -- tie, replacing only on a strictly greater key. Whichever row arrives
      -- first is then frozen in: re-publishing the value cannot dislodge a
      -- delete, and re-publishing a delete cannot dislodge a value, because
      -- every copy carries the same observedAt.
      --
      -- Measured on urn:filter:1 hasStrength (observedAt 2024-02-28T13:52:35):
      -- the view latched a deleted=true row, four later re-emissions of the
      -- live value all tied and lost, and the count constraint reported
      -- "Found 0 properties instead of [1, 1]" against an attribute that
      -- plainly existed. Writing one value with a CURRENT observedAt was
      -- strictly greater, displaced it, and cleared the alert in 15 seconds.
      --
      -- The offset is strictly monotonic per partition, so it is arrival
      -- order stated explicitly. Must mirror lib/utils.py create_yaml_view.
      SELECT /*+ STATE_TTL('attributes' = '{{.Values.flink.viewTtl}}') */ *,
      ROW_NUMBER() OVER (PARTITION BY `id`, `datasetId`
         ORDER BY COALESCE(`observedAt`, `ts`) DESC, `offset` DESC) AS rownum
      FROM `attributes`)
      WHERE rownum = 1;
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes-insert
spec:
  name: attributes_insert
  connector: upsert-kafka
  fields:
  - id: STRING
  - parentId: STRING
  - entityId: STRING
  - name: STRING
  - nodeType: STRING
  - valueType: STRING
  - type: STRING
  - attributeValue: STRING
  - datasetId: STRING
  - unitCode: STRING
  - lang: STRING
  - deleted: BOOLEAN
  - synced: BOOLEAN
  - ts: TIMESTAMP(3) METADATA FROM 'timestamp' VIRTUAL
  - watermark: FOR `ts` AS `ts`
  kafka:
    topic: iff.ngsild.attributes_insert
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    key.format: json
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
  primaryKey:
  - id
  - datasetId
---
apiVersion: industry-fusion.com/v1alpha2
kind: BeamSqlTable
metadata:
  name: attributes-insert-filter
spec:
  name: attributes_insert_filter
  connector: kafka
  fields:
  - id: STRING
  - parentId: STRING
  - entityId: STRING
  - name: STRING
  - nodeType: STRING
  - valueType: STRING
  - type: STRING
  - attributeValue: STRING
  - datasetId: STRING
  - unitCode: STRING
  - lang: STRING
  - deleted: BOOLEAN
  - synced: BOOLEAN
  - ts: TIMESTAMP(3) METADATA FROM 'timestamp'
  - watermark: FOR `ts` AS `ts`
  kafka:
    topic: iff.ngsild.attributes_insert
    properties:
      bootstrap.servers: {{.Values.kafka.bootstrapServer}}
    scan.startup.mode: latest-offset
  value:
    format: json
    json.fail-on-missing-field: false
    json.ignore-parse-errors: true
---
apiVersion: industry-fusion.com/v1alpha1
kind: BeamSqlView
metadata:
  name: attributes-insert-view
spec:
  name: attributes_insert_view
  sqlstatement: |
    SELECT entityId, name, nodeType, valueType, `type`,
          `attributeValue`,
          `datasetId`,
          `unitCode`,
          `lang`,
          `deleted`,
          `synced`,
          `ts`
    FROM (
      SELECT /*+ STATE_TTL('attributes_insert_filter' = '{{.Values.flink.ttl}}') */ *,
      ROW_NUMBER() OVER (PARTITION BY `id`, `datasetId`
         ORDER BY ts DESC) AS rownum
      FROM `attributes_insert_filter`)
      WHERE rownum = 1;