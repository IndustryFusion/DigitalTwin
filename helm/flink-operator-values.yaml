# Values for the flink-kubernetes-operator chart, used by install_operators.sh.
defaultConfiguration:
  create: true
  append: true
  # Replaces the chart's own overrides, so its defaults are repeated here.
  flink-conf.yaml: |+
    # Flink Config Overrides
    kubernetes.operator.metrics.reporter.slf4j.factory.class: org.apache.flink.metrics.slf4j.Slf4jReporterFactory
    kubernetes.operator.metrics.reporter.slf4j.interval: 5 MINUTE

    kubernetes.operator.reconcile.interval: 15 s
    kubernetes.operator.observer.progress-check.interval: 5 s

    # The operator submits a session job and waits for the answer this long.
    # With the default 10 s, a slowly starting session cluster made it give
    # up while the submission still ran, and the retry submitted the core
    # services a second time: two jobs, every output twice.
    kubernetes.operator.flink.client.timeout: 120 s
    # Newer operators wait for submissions with this option instead.
    kubernetes.operator.job.submission.timeout: 10 min
