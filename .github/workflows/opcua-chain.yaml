# Verifies the path from an OPC UA server to the context broker, as specified in contracts/opcua-live-data,
# without a Kubernetes cluster. It doesn't cover Core Services or MQTT authentication; see test/opcua-chain.
name: OPC UA chain test (without Core Services and MQTT auth)

on:
  push:
    branches: [ main ]
    paths:
      - 'semantic-model/opcua/**'
      - 'semantic-model/dataservice/**'
      - 'KafkaBridge/**'
      - 'NgsildAgent/**'
      - 'test/opcua-chain/**'
      - '.env'
      - 'test/build-local-platform.sh'
      - '.github/workflows/opcua-chain.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'semantic-model/opcua/**'
      - 'semantic-model/dataservice/**'
      - 'KafkaBridge/**'
      - 'NgsildAgent/**'
      - 'test/opcua-chain/**'
      - '.env'
      - 'test/build-local-platform.sh'
      - '.github/workflows/opcua-chain.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      OUT: ${{ github.workspace }}/.opcua-chain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Node 24 as in the KafkaBridge image; its npm 11 honours the
      # version-ranged overrides of KafkaBridge's lock file, npm 10 rejects it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare
        run: mkdir -p "$OUT"
      - name: Stage 1 - the model, Steps 1 to 3 of the tutorial
        run: bash test/opcua-chain/stage1.sh
      - name: Stage 2 - the connector with the test server, the agent replaced
        run: bash test/opcua-chain/stage2.sh
      - name: Stage 3 - the agent's schema and the bridge's mapping
        run: bash test/opcua-chain/stage3.sh
      # The broker the platform pins, built once per commit and kept in the cache, as in context-broker.yaml
      - name: The pinned broker commit
        id: pin
        run: echo "commit=$(sed -n 's/^SCORPIO_COMMIT=//p' test/build-local-platform.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: broker-cache
        with:
          path: .scorpio-image.tar
          key: scorpio-all-in-one-runner-${{ steps.pin.outputs.commit }}-${{ hashFiles('test/opcua-chain/scorpio-image.sh', 'test/build-local-platform.sh') }}
      - uses: actions/setup-java@v4
        if: steps.broker-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: The pinned broker image
        run: |
          [ -f .scorpio-image.tar ] && docker load -i .scorpio-image.tar
          image=$(bash test/opcua-chain/scorpio-image.sh)
          [ -f .scorpio-image.tar ] || docker save "$image" -o .scorpio-image.tar
          echo "SCORPIO_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: steps.broker-cache.outputs.cache-hit != 'true'
        with:
          path: .scorpio-image.tar
          key: ${{ steps.broker-cache.outputs.cache-primary-key }}
      - name: Stage 4a - the context broker the platform pins
        run: bash test/opcua-chain/stage4a.sh
      - name: Stage 4b - the updates bridge against the broker
        run: bash test/opcua-chain/stage4b.sh
      - name: Logs on failure
        if: failure()
        run: |
          for f in "$OUT"/*.log; do echo "=== $f"; tail -n 25 "$f" | cut -c1-200; done
          docker logs opcua-chain-scorpio 2>&1 | tail -n 25 | cut -c1-200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opcua-chain-python-${{ matrix.python }}
          path: |
            .opcua-chain/*.jsonl
            .opcua-chain/*.log
          if-no-files-found: ignore
