# Starts the K8s end-to-end tests when one of their labels is added to a pull
# request: e2e-all runs every shard of K8s e2e, e2e-full runs K8s tests on the
# self-hosted runner. GitHub sends `labeled` for every label; only this
# workflow listens to it, so any other label starts neither K8s workflow and
# puts no skipped check of theirs on the pull request.
name: K8s e2e labels

on:
  pull_request:
    branches: [ main ]
    types: [ labeled ]
    paths-ignore:
      - 'openspec/**'

permissions:
  contents: read

jobs:
  e2e-all:
    if: github.event.label.name == 'e2e-all'
    uses: ./.github/workflows/k8s-e2e.yaml

  e2e-full:
    if: github.event.label.name == 'e2e-full'
    uses: ./.github/workflows/k8s-tests.yaml
