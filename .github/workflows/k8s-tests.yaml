name: K8s tests

# Every suite on one full install on the self-hosted runner: the nightly calls
# this. A pull request runs its shards on GitHub-hosted runners (k8s-e2e.yaml)
# and comes here only with the label e2e-full: adding it starts this workflow
# through e2e-labels.yaml, so no other label starts a run of it.
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - 'openspec/**'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: k8s-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SELF_HOSTED_RUNNER: true

jobs:
  clean-docker:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')
    uses: ./.github/workflows/docker-clean.yaml

  build:
    needs: clean-docker
    runs-on: private
    steps:
    - uses: actions/checkout@v4
    - name: Prepare K3d cluster
      run: |
        if [ -z "${SELF_HOSTED_RUNNER}" ]; then
          ( cd ./test && bash ./prepare-platform.sh )
        else
          ( cd ./test && bash ./prepare-platform-for-self-hosted-runner.sh )
        fi
    # Linting the suites and the suites that need no cluster (test/bats-unit)
    # run in the Build workflow's test-scripts job.
    - name: Prepare Bats framework
      run: |
        cd ./test/bats
        bash ./prepare-test.sh
    - name: Prepare airgap deployment
      run: |
        cd helm/airgap-deployment && REGISTRY=k3d-iff.localhost:12345 bash prepare-airgap.bash
    - name: Build Platform locally
      run: |
        cd test && bash build-local-platform.sh
    - name: Install from local registry
      run: cd test && bash ./install-platform.sh -lo -c all
    # As in K8s e2e: the core services report as deployed while their tasks
    # still deploy, and a job that runs twice is named here, not by the suites.
    - name: Wait until the Flink jobs run every task
      run: bash test/wait-for-flink-jobs.sh 600
    - name: Run all e2e tests
      run: |
        echo sleep 60s to let the system settle
        sleep 60
        source ./miniconda3/etc/profile.d/conda.sh
        conda activate e2etest
        (exec kubefwd -n iff svc) &
        sleep 10
        cd ./test/bats
        DEBUG=true bats */*.bats
        killall kubefwd
    - name: Test shacl2flink against the platform
      run: |
        source ./miniconda3/etc/profile.d/conda.sh
        conda activate py310
        # lint, test and test-kms run in the Build workflow's shacl2flink job;
        # only what needs the cluster stays here.
        ( cd semantic-model/shacl2flink && make setup )
        # Deploys a throwaway KMS, asserts real alerts on Kafka, tears it down.
        # This replaces test-full-flink-deployment, which only proved the helm
        # package deploys and undeploys: that is a strict subset of what this
        # target does, so running both cost a second full deploy cycle for no
        # extra coverage. The production ../kms/default is still compiled on every
        # build by the Build workflow (make build), just not deployed here.
        ( cd semantic-model/shacl2flink && make test-flink-e2e )

