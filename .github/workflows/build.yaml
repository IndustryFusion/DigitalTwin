name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'openspec/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'openspec/**'
  workflow_call:
  workflow_dispatch:
    inputs:
      debug:
        description: Open a tmate shell in a job that fails
        type: boolean
        default: false

permissions:
  contents: read

# One job per component, so they run side by side instead of one after the
# other: the wall time is the slowest component, not the sum of all of them.
# No job depends on another one's output; each sets up what it needs itself.
# A failed job opens a tmate shell only when asked for: the label ci-debug on
# the pull request, or the input debug of a manual run. Otherwise it would
# wait for a connection until it times out, and the failure would show late.
jobs:
  docker-images:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Debezium plugin archive from the cache
      uses: ./.github/actions/debezium-archive
    - name: Maven repository from the cache
      uses: ./.github/actions/maven-cache
      with:
        mode: restore
        name: compose
        hash: ${{ hashFiles('FlinkOperatorWithCoreServices/CoreServices/pom.xml', 'FlinkSqlGateway/Dockerfile') }}
    - name: Build the Docker images
      run: docker compose build
    - name: Maven repository into the cache
      if: success()
      uses: ./.github/actions/maven-cache
      with:
        mode: save
        name: compose
        hash: ${{ hashFiles('FlinkOperatorWithCoreServices/CoreServices/pom.xml', 'FlinkSqlGateway/Dockerfile') }}
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  shacl2flink:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    # Use conda-incubator to install Miniconda
    - name: Setup Miniconda with Python 3.10
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: "3.10"  # Specify Python 3.10
        auto-activate-base: false  # Do not auto-activate the base environment
        use-mamba: true  # Optional: use mamba for faster environment creation
    - name: Create a new Conda environment
      run: conda create --name py310 python=3.10 -y
    - name: Install sqlite3 with the PCRE extension
      run: bash .github/scripts/install-sqlite-pcre.sh
    - name: Build shacl2flink
      run: |
        source $CONDA/bin/activate
        conda activate py310
        cd semantic-model/shacl2flink && make setup && make lint test build test-kms test-opcua-shapes test-pyshacl-compare
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  dataservice:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Miniconda with Python 3.10
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: "3.10"
        auto-activate-base: false
        use-mamba: true
    - name: Create a new Conda environment
      run: conda create --name py310 python=3.10 -y
    - name: Build Dataservice
      run: |
        source $CONDA/bin/activate
        conda activate py310
        cd semantic-model/dataservice && make setup && make lint test
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  semforge-sdk:
    runs-on: ubuntu-24.04
    # The page tests run the pages' scripts in headless Chromium. Without one
    # they skip locally; here a missing browser fails them instead.
    env:
      SEMFORGE_REQUIRE_CHROME: "1"
    steps:
    - uses: actions/checkout@v4
    # The runner image ships Google Chrome; nothing to install.
    - name: Find headless Chromium for the page tests
      run: |
        chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser) \
          || { echo "::error::no Chrome or Chromium on the runner"; exit 1; }
        "${chrome}" --version
        echo "SEMFORGE_CHROME=${chrome}" >> "${GITHUB_ENV}"
    - name: Setup Miniconda with Python 3.10
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: "3.10"
        auto-activate-base: false
        use-mamba: true
    - name: Create a new Conda environment
      run: conda create --name py310 python=3.10 -y
    # For the SQLite cross-check's tests (--cross-check sqlite), which
    # otherwise skip: the compiler's dependencies and sqlite3 with PCRE.
    - name: Install sqlite3 with the PCRE extension
      run: bash .github/scripts/install-sqlite-pcre.sh
    # kms-check also keeps every release record append-only: on a pull
    # request it compares each .kms/releases.yaml with the one on the base
    # branch, which the shallow checkout lacks and is fetched here. Other
    # events have no base to compare with and skip that comparison.
    - name: Build SemForge SDK
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        source $CONDA/bin/activate
        conda activate py310
        against=""
        if [ -n "$BASE_REF" ]; then
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          against="origin/$BASE_REF"
        fi
        cd semantic-model/SemForge-SDK && make setup && venv/bin/pip install -q -r requirements-crosscheck.txt && make lint test kms-check KMS_AGAINST="$against"
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  # Whether the SemForge SDK changed: its end-to-end suites run only then --
  # and always in the nightly and a manual run, which have nothing to compare.
  semforge-changes:
    runs-on: ubuntu-24.04
    outputs:
      sdk: ${{ steps.paths.outputs.sdk }}
    steps:
    - uses: actions/checkout@v4
    - id: paths
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ "$EVENT" != pull_request ] && [ "$EVENT" != push ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
          echo "sdk=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        git fetch --no-tags --depth=1 origin "$BASE"
        if git diff --name-only "$BASE" HEAD | grep -q '^semantic-model/SemForge-SDK/'; then
          echo "sdk=true" >> "$GITHUB_OUTPUT"
        else
          echo "sdk=false" >> "$GITHUB_OUTPUT"
        fi

  # The extension in a real VS Code against its real language server: every
  # suite of vscode/test/e2e/suite, under xvfb, in the VS Code version
  # vscode/test/e2e/run.js pins. run.js fails the run unless every suite file
  # was loaded and every test ran and passed, and prints the line checked here.
  semforge-e2e:
    needs: semforge-changes
    if: needs.semforge-changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: semantic-model/SemForge-SDK
    steps:
    - uses: actions/checkout@v4
    - name: Setup Miniconda with Python 3.10
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: "3.10"
        auto-activate-base: false
        use-mamba: true
    - name: Create a new Conda environment
      run: conda create --name py310 python=3.10 -y
    - name: Set up the SDK
      run: |
        source $CONDA/bin/activate
        conda activate py310
        make setup
    # npm 11 (Node 24), which wrote the lock file: npm 10 ignores its
    # version-ranged overrides (glob, minimatch) and npm ci refuses the tree.
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: semantic-model/SemForge-SDK/vscode/package-lock.json
    - name: Install the extension's dependencies and xvfb
      run: |
        cd vscode && npm ci --no-audit --no-fund
        sudo apt-get update -q && sudo apt-get install -y -q xvfb
    - name: The pinned VS Code version
      id: vscode
      run: echo "version=$(grep -oP "VSCODE_VERSION = '\K[^']+" vscode/test/e2e/run.js)" >> "$GITHUB_OUTPUT"
    - name: VS Code from the cache
      uses: actions/cache@v4
      with:
        path: semantic-model/SemForge-SDK/vscode/.vscode-test/vscode-linux-x64-${{ steps.vscode.outputs.version }}
        key: semforge-vscode-linux-x64-${{ steps.vscode.outputs.version }}
    - name: Run every end-to-end suite
      run: |
        cd vscode
        set -o pipefail
        xvfb-run -a npm run test:e2e 2>&1 | tee e2e.log
        grep -E "^SemForge e2e: ([0-9]+) of \1 suite files, [0-9]+ tests, [0-9]+ passed, " e2e.log \
          || { echo "::error::the end-to-end suites did not all run"; exit 1; }
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  datamodel-tools:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    # npm 11 (Node 24): the lock file's version-ranged overrides are ignored by
    # npm 10, which then installs another tree than the one locked.
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Build datamodel tools
      run: |
        cd semantic-model/datamodel/tools && make setup && make lint test
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  opcua-tools:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Miniconda with Python 3.10
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: "3.10"
        auto-activate-base: false
        use-mamba: true
    - name: Create a new Conda environment
      run: conda create --name py310 python=3.10 -y
    - name: Build opcua tools
      run: |
        source $CONDA/bin/activate
        conda activate py310
        pip3 install asyncua
        # owlready2 is LGPL-3.0-or-later (incompatible with this repo's
        # default Apache-2.0 dependency set), so it's deliberately excluded
        # from requirements-dev.txt -- see semantic-model/opcua/README.md.
        # Installed here explicitly, as a one-off, only so CI can exercise
        # check_consistency.py's HermiT-based e2e tests.
        pip3 install owlready2==0.51
        cd semantic-model/opcua && make setup && make lint
        # `make test` downloads ontologies from industryfusion.github.io and
        # opcfoundation.org at build time, and GitHub Pages intermittently
        # serves 503 to Actions runners while answering 200 elsewhere --
        # measured five consecutive failures over four hours, each a 503 on
        # an owl:imports fetch. Retry with spacing instead of failing the
        # whole build on the first throttled edge; a genuine test failure
        # still fails every attempt. 3x90s proved too short against a
        # sustained throttle window (two consecutive builds died on the same
        # fetch), so the loop now rides out ~25 minutes. Vendoring the
        # ontologies would remove this failure class entirely.
        for attempt in 1 2 3 4 5 6; do
          make test && break
          [ "$attempt" = "6" ] && exit 1
          echo "make test failed (attempt $attempt), retrying in 300s"
          sleep 300
        done
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  iff-agent:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Build iff-agent
      run: |
        (cd NgsildAgent/config && cp config.json.template config.json)
        cd NgsildAgent && npm install && npm run lint && npm run test && npm audit --production --audit-level high
    - name: Setup tmate session
      if: ${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci-debug') || inputs.debug) }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  # The shell side of the K8s tests that needs no cluster: linting the bats
  # suites, and the suites that run helm-templated scripts against a mocked
  # kubectl (test/bats-unit). Fails in a minute instead of after a platform
  # install.
  test-scripts:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    # Without apt: its mirrors answer GitHub's runners with 503 at times.
    # shellcheck is preinstalled on the runner image.
    - name: Install bats
      run: |
        git clone -q --depth 1 --branch v1.10.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
        sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
        bats --version
        shellcheck --version
    - name: Lint the bats suites
      run: |
        cd test/bats
        bash ./prepare-test.sh
        bats linting.bats
        shellcheck *.sh *.bats test-*/*.bats ../bats-unit/*.bats \
          ../../.github/scripts/*.sh ../prepare-platform-for-github-runner.sh \
          ../platform-images.sh ../wait-for-flink-jobs.sh ../wait-for-kubefwd.sh \
          ../../DebeziumPostgresConnector/fetch-verified.sh ../../DebeziumPostgresConnector/fetch-plugin.sh \
          ../../helm/adopt-kafka-topics.sh ../../helm/check-release-keeps-topics.sh \
          ../../semantic-model/shacl2flink/shacl_resync.sh \
          ../../semantic-model/shacl2flink/deploy_validation.sh \
          ../../semantic-model/shacl2flink/restart_connect.sh \
          ../../semantic-model/shacl2flink/validation_job.sh \
          ../../semantic-model/shacl2flink/tests/bats/test-shacl-flink-resync/*.bats \
          ../../semantic-model/shacl2flink/tests/bats/test-shacl-flink-deploy/*.bats
    - name: Run the bats suites without a cluster
      run: bats test/bats-unit

  # Does a Debezium snapshot of the large knowledge table fit the Connect heap
  # the chart deploys? Needs only Docker: Kafka, Postgres and the platform's
  # own Connect image, built here from docker-compose.yml.
  debezium-snapshot-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Debezium plugin archive from the cache
      uses: ./.github/actions/debezium-archive
    - name: Build the Kafka Connect image
      run: docker compose build debezium-postgresql-connector
    - name: Snapshot the knowledge table within the chart's heap
      run: |
        export $(grep -v '^#' .env | xargs)
        bash test/debezium-snapshot-memory/test.sh

  # The example KMS packages built from OPC UA models (openspec
  # gh-944-opcua-kms-package): generated and verified here, never committed.
  opcua-kms-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Setup Miniconda with Python 3.10
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: "3.10"
        auto-activate-base: false
        use-mamba: true
    - name: Create a new Conda environment
      run: conda create --name py310 python=3.10 -y
    - name: Set up the SemForge SDK
      run: |
        source $CONDA/bin/activate
        conda activate py310
        cd semantic-model/SemForge-SDK && make setup
    - name: Generate and verify the OPC UA KMS packages
      run: |
        source $CONDA/bin/activate
        conda activate py310
        cd semantic-model/opcua && make setup
        # Generation downloads NodeSets and ontologies, which GitHub Pages
        # intermittently answers with 503 (see `opcua-tools`); it retries like
        # the opcua tests do. Verifying what it wrote does not retry: a package
        # that does not verify fails the job at once.
        for attempt in 1 2 3 4 5 6; do
          make kms-packages && break
          [ "$attempt" = "6" ] && exit 1
          echo "make kms-packages failed (attempt $attempt), retrying in 300s"
          sleep 300
        done
        make kms-packages-check
