name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker images
      run: docker compose build
    # Use conda-incubator to install Miniconda
    - name: Setup Miniconda with Python 3.10
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: "3.10"  # Specify Python 3.10
        auto-activate-base: false  # Do not auto-activate the base environment
        use-mamba: true  # Optional: use mamba for faster environment creation
    - name: Create a new Conda environment
      run: conda create --name py310 python=3.10 -y
    - name: Build shacl2flink
      run: |
        sudo  apt install -y sqlite3 libsqlite3-dev libpcre2-dev
        sudo mkdir -p /usr/lib/sqlite3
        git clone https://github.com/christian-proust/sqlite3-pcre2.git
        cd sqlite3-pcre2 && make && make install
        cd ../ && rm -rf sqlite3-pcre2
        source $CONDA/bin/activate
        conda activate py310
        cd semantic-model/shacl2flink && make setup && make lint test build test-kms test-opcua-shapes test-pyshacl-compare
    - name: Build Dataservice
      run: |
        source $CONDA/bin/activate
        conda activate py310
        cd semantic-model/dataservice && make setup && make lint test
    - name: Build datamodel tools
      run: |
        cd semantic-model/datamodel/tools && make setup && make lint test
    - name: Build opcua tools
      run: |
        source $CONDA/bin/activate
        conda activate py310
        pip3 install asyncua
        # owlready2 is LGPL-3.0-or-later (incompatible with this repo's
        # default Apache-2.0 dependency set), so it's deliberately excluded
        # from requirements-dev.txt -- see semantic-model/opcua/README.md.
        # Installed here explicitly, as a one-off, only so CI can exercise
        # check_consistency.py's HermiT-based e2e tests.
        pip3 install owlready2==0.51
        cd semantic-model/opcua && make setup && make lint
        # `make test` downloads ontologies from industryfusion.github.io and
        # opcfoundation.org at build time, and GitHub Pages intermittently
        # serves 503 to Actions runners while answering 200 elsewhere --
        # measured five consecutive failures over four hours, each a 503 on
        # an owl:imports fetch. Retry with spacing instead of failing the
        # whole build on the first throttled edge; a genuine test failure
        # still fails every attempt. 3x90s proved too short against a
        # sustained throttle window (two consecutive builds died on the same
        # fetch), so the loop now rides out ~25 minutes. Vendoring the
        # ontologies would remove this failure class entirely.
        for attempt in 1 2 3 4 5 6; do
          make test && break
          [ "$attempt" = "6" ] && exit 1
          echo "make test failed (attempt $attempt), retrying in 300s"
          sleep 300
        done
    - name: Build iff-agent
      run: |
        (cd NgsildAgent/config && cp config.json.template config.json)  
        cd NgsildAgent && npm install && npm run lint && npm run test && npm audit --production --audit-level high
    - name: Setup tmate session
      if: ${{ failure() }}
      uses: mxschmitt/action-tmate@v3
