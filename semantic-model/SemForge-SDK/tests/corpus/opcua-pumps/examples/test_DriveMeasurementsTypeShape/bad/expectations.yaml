# Cases in this directory are expected to VIOLATE, and to say which constraint.
examples:
  - path: voltage-too-many.jsonld
    description: 'hasVoltage more than 1: 2 instances, each its own datasetId. A new
      entity, its required attributes given valid values.'
    expect: invalid
    asserts:
      - constraint: shacl:DriveMeasurementsTypeShape/hasVoltage/MaxCountConstraintComponent
        resource: urn:opcua-kms:drivemeasurementstype:test
  - path: power-factor-too-many.jsonld
    description: 'hasPowerFactor more than 1: 2 instances, each its own datasetId.
      Started from test_DriveMeasurementsTypeShape/bad/voltage-too-many.jsonld.'
    expect: invalid
    asserts:
      - constraint: shacl:DriveMeasurementsTypeShape/hasPowerFactor/MaxCountConstraintComponent
        resource: urn:opcua-kms:drivemeasurementstype:test
